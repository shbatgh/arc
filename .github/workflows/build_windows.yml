name: Build Windows App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: false

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: |
        uv sync


    - name: Import smoke test
      run: |
        uv run python -c "from Arc.app.main_window import MainWindow"
